name: ci
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install yamlreel
        run: python -m pip install "yamlreel[ffmpeg]>=0.2.2,<0.3"
      - name: Setup check
        run: python scripts/check_setup.py
      - name: E2E (preview)
        run: python tests/e2e.py --preview
